- name: Setup Catalogue
  hosts: all
  become: yes
  tasks:
    - name: Install Golang, Git, Mysql 8.4
      ansible.builtin.dnf:
        name:
          - golang
          - git
        state: present

    - name: Install Mysql Client
      ansible.builtin.dnf:
        name: mysql8.4
        state: present

    - name: Copy Service to systemd path
      ansible.builtin.copy:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service

    - name: Remove Application directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Create Application directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download and unarchive code
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/catalogue.zip
        dest: /app
        remote_src: yes

    - name: Create application user
      ansible.builtin.user:
        name: appuser
        system: yes
        shell: /bin/false
        create_home: no

    - name: Load schema
      ansible.builtin.shell: mysql -h mysql-dev.kaldevops14.online -u root -pRoboShop@1 < db/schema.sql
      args:
        chdir: /app

    - name: Load appuser
      ansible.builtin.shell: mysql -h mysql-dev.rdevopsb89.online -u root -pRoboShop@1 < db/app-user.sql
      args:
        chdir: /app

    - name: Load Master data
      ansible.builtin.shell: mysql -h mysql-dev.rdevopsb89.online -u root -pRoboShop@1 catalogue < db/master-data.sql
      args:
        chdir: /app
    
    - name: Compile app code
      ansible.builtin.shell: go mod tidy && CGO_ENABLED=0 go build -o /app/catalogue .
      args:
        chdir: /app

    - name: Apply permissions and ownership
      ansible.builtin.file:
        path: /app
        user: appuser
        group: appuser
        recurse: yes
        mode: 'o-rwx'
    - name: Start Catalogue service
      ansible.builtin.systemd_service:
        name: catalogue
        state: started
        enabled: yes
        daemon_reload: yes
    