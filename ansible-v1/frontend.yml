- name: Setup Frontend
  hosts: all
  become: yes
  tasks:
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present
    
    - name: Copy Nginx configuration
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf

    # - name: Install Npm
    #   ansible.builtin.shell: curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -

    # - name: Install nodejs
    #   ansible.builtin.dnf:
    #     name: nodejs
    #     state: present

    - name: Remove application directory
      ansible.builtin.file:
        path: /usr/share/nginx/html/
        state: absent

    - name: Create application directory
      ansible.builtin.file:
        path: /usr/share/nginx/html/
        state: directory

    - name: Download Frontend code
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/frontend-compiled.zip
        dest: /usr/share/nginx/html/
        remote_src: yes

    # - name: Compile and build using Npm
    #   ansible.builtin.shell: npm cache clean --force ; npm install ; npm run build ; rm -rf /usr/share/nginx/html/* ; cp -r out/* /usr/share/nginx/html/
    #   args:
    #       chdir: "/tmp/frontend"

    - name: Start Nginx service
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        daemon_reload: true
        enabled: true
