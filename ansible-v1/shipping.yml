- name: Setup Shipping
  hosts: all
  become: yes
  tasks:
    - name: Install Java and Maven 
      ansible.builtin.dnf:
        name:
          - java-21-openjdk
          - java-21-openjdk-devel
          - maven
        state: present

    - name: Install Mysql Client
      ansible.builtin.dnf:
        name: mysql8.4
        state: present

    - name: Copy service to systemd
      ansible.builtin.copy:
        src: shipping.service
        dest: /etc/systemd/system/shipping.service

    - name: Create application user
      ansible.builtin.user:
        name: appuser
        system: yes
        shell: /bin/false
        create_home: no

    - name: Remove Application directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Create Application directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Load schema
      ansible.builtin.shell: mysql -h mysql-dev.kaldevops14.online -u root -pRoboShop@1 < db/schema.sql
      args:
        chdir: /app

    - name: Load appuser
      ansible.builtin.shell: mysql -h mysql-dev.kaldevops14.online -u root -pRoboShop@1 < db/app-user.sql
      args:
        chdir: /app

    - name: Download User code
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/shipping.zip
        dest: /app
        remote_src: yes

    - name: Install Maven dependencies
      ansible.builtin.shell: mvn clean package -DskipTests
      args:
        chdir: /app

    - name: Apply permissions and ownership
      ansible.builtin.file:
        path: /app
        owner: appuser
        group: appuser
        recurse: yes
        mode: 'o-rwx'

    - name: Enable and Restart Shipping service
      ansible.builtin.systemd_service:
        name: shipping
        state: restarted
        enabled: yes
        daemon_reload: yes
    

    
    
    