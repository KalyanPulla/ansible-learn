- name: Setup Cart
  hosts: all
  become: yes
  tasks:
    - name: Download nodejs file
      ansible.builtin.shell: curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -

    - name: Install nodejs
      ansible.builtin.dnf:
        name: nodejs
        state: present

    - name: Copy service to systemd
      ansible.builtin.copy:
        src: cart.service
        dest: /etc/systemd/system/cart.service

    - name: Create application user
      ansible.builtin.user:
        name: appuser
        system: yes
        shell: /bin/false
        create_home: no

    - name: Remove Application directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Create Application directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download Cart Application code
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/cart.zip
        dest: /app
        remote_src: yes

    - name: Compile code and app dependencies
      ansible.builtin.shell: npm install --production
      args:
        chdir: /app

    - name: Apply permissions and ownership
      ansible.builtin.file:
        path: /app
        owner: appuser
        group: appuser
        recurse: yes
        mode: 'o-rwx'

    - name: Enable and Restart User service
      ansible.builtin.systemd_service:
        name: cart
        state: restarted
        enabled: yes
        daemon_reload: yes
    